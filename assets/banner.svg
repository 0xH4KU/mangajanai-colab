<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title description">
  <title id="title">MangaJaNai Colab</title>
  <desc id="description">A Colab GPU notebook for manga and color illustrations. Two-times FP16 upscaling with resumable ZIP output.</desc>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#263248" opacity=".24"/>
    </pattern>
    <linearGradient id="color" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7654ef"/>
      <stop offset="1" stop-color="#4c94d9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" rx="22" fill="#f4f1e9"/>
  <rect x="0" y="0" width="9" height="330" rx="4" fill="#7654ef"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="60" y="66" font-size="13" font-weight="700" letter-spacing="3" fill="#7654ef">MANGA + ILLUSTRATION</text>
    <text x="56" y="140" font-size="60" font-weight="700" letter-spacing="-2.5" fill="#182238">MangaJaNai Colab</text>
    <text x="60" y="182" font-size="23" fill="#5e6571">Sharper pages. Your GPU is in the cloud.</text>
    <g font-size="14" font-weight="600" fill="#33415a">
      <rect x="60" y="226" width="118" height="36" rx="18" fill="#e6dff8"/>
      <text x="83" y="249">2x · FP16</text>
      <rect x="190" y="226" width="160" height="36" rx="18" fill="#e7e9ef"/>
      <text x="215" y="249">PDF · CBZ · ZIP</text>
      <rect x="362" y="226" width="160" height="36" rx="18" fill="#e7e9ef"/>
      <text x="386" y="249">Resume on Drive</text>
    </g>
  </g>
  <g transform="translate(884 39)">
    <rect x="10" y="12" width="224" height="252" rx="12" fill="#182238" opacity=".09"/>
    <rect width="224" height="252" rx="12" fill="#fffefb" stroke="#182238" stroke-width="2.5"/>
    <rect x="17" y="18" width="190" height="91" rx="3" fill="url(#dots)" stroke="#182238" stroke-width="2.5"/>
    <path d="M25 94 73 34 113 81 155 43 199 94" fill="none" stroke="#182238" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="174" cy="39" r="9" fill="#fffefb" stroke="#182238" stroke-width="2.5"/>
    <rect x="17" y="121" width="85" height="113" rx="3" fill="url(#color)"/>
    <path d="M30 209Q58 133 90 202" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="114" y="121" width="93" height="113" rx="3" fill="#e69a6c"/>
    <circle cx="161" cy="170" r="25" fill="#f8d9a2"/>
    <path d="M123 220 148 194 176 220 197 203" fill="none" stroke="#182238" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
